    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');</style>
</head>
<body class="bg-background text-gray-300 min-h-screen flex selection:bg-primary selection:text-black">

    <!-- Sidebar Navigation -->

            <div class="flex items-center space-x-3">

                    <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>

            <nav class="space-y-2">

                    <span>Analyze App</span>

                <a href="reports.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-surfaceBorder/50 font-medium text-sm transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <span>Reports</span>
                </a>
                <a href="history.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-white bg-surfaceBorder/50 font-medium text-sm transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>History Logs</span>
                </a>
                <a href="profile.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-surfaceBorder/50 font-medium text-sm transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span>Profile Settings</span>
                </a>
            </nav>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-grow flex flex-col min-w-0">
        
        <!-- Header -->
        <header class="h-20 border-b border-surfaceBorder bg-surface/60 backdrop-blur-md px-8 flex items-center justify-between sticky top-0 z-40">
            <div>
                <span class="text-xs font-mono text-gray-500 uppercase tracking-widest">Payload Timeline</span>
                <h1 class="text-lg font-bold text-white tracking-tight">App Audit History Logs</h1>
            </div>
            <div id="clearHistoryContainer"></div>
        </header>

        <!-- Main Workspace -->
        <main class="p-8 space-y-8 flex-grow max-w-7xl mx-auto w-full">
            
            <!-- Quick Metrics Overview Bar -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Total Audits -->
                <div class="p-6 bg-surface border border-surfaceBorder rounded-2xl flex items-center justify-between relative overflow-hidden">
                    <div>
                        <p class="text-xs font-mono text-gray-500 uppercase tracking-wider mb-1">Total Audits</p>
                        <h3 id="totalScansCount" class="text-3xl font-black text-white">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center border border-purple-500/20">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                </div>

                <!-- Low Risk -->
                <div class="p-6 bg-surface border border-surfaceBorder rounded-2xl flex items-center justify-between relative overflow-hidden">
                    <div>
                        <p class="text-xs font-mono text-gray-500 uppercase tracking-wider mb-1">Low Risk</p>
                        <h3 id="safeScansCount" class="text-3xl font-black text-primary">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-primary/10 text-primary flex items-center justify-center border border-primary/20">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                    </div>
                </div>

                <!-- Medium Risk -->
                <div class="p-6 bg-surface border border-surfaceBorder rounded-2xl flex items-center justify-between relative overflow-hidden">
                    <div>
                        <p class="text-xs font-mono text-gray-500 uppercase tracking-wider mb-1">Medium Risk</p>
                        <h3 id="mediumScansCount" class="text-3xl font-black text-amber-400">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center border border-amber-500/20">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    </div>
                </div>

                <!-- High Risk -->
                <div class="p-6 bg-surface border border-surfaceBorder rounded-2xl flex items-center justify-between relative overflow-hidden">
                    <div>
                        <p class="text-xs font-mono text-gray-500 uppercase tracking-wider mb-1">High Risk</p>
                        <h3 id="threatScansCount" class="text-3xl font-black text-red-400">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-red-500/10 text-red-400 flex items-center justify-center border border-red-500/20">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path></svg>
                    </div>
                </div>
            </div>

            <!-- SEARCH BAR WIDGET -->
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" id="searchHistoryInput" onkeyup="filterHistory()" placeholder="Search app name, package name, or status in history logs..." class="w-full bg-surface border border-surfaceBorder rounded-2xl py-4 pl-12 pr-4 text-white text-sm focus:outline-none focus:border-primary/50 transition-colors shadow-lg">
            </div>

            <!-- History Table Container -->
            <div class="bg-surface border border-surfaceBorder rounded-3xl overflow-hidden shadow-2xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-gray-400">
                        <thead class="text-xs uppercase bg-surfaceBorder/40 text-gray-400 font-mono tracking-wider border-b border-surfaceBorder">
                            <tr>
                                <th class="px-6 py-4">Timestamp</th>
                                <th class="px-6 py-4">App Name & Target ID</th>
                                <th class="px-6 py-4">Risk Index</th>
                                <th class="px-6 py-4">Security Classification</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody" class="divide-y divide-surfaceBorder/60">
                            <!-- Injected dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Script Logic with Real-time Search -->
    <script>
        let historyData = [];

        async function fetchHistoryLogs() {
            try {
                const userEmail = localStorage.getItem('userEmail') || '';
                const response = await fetch(`/api/get-scans?email=${encodeURIComponent(userEmail)}`);
                const result = await response.json();

                if (result.success) {
                    historyData = result.history;
                    updateMetricsAndRender();
                }
            } catch (err) {
                console.error('Failed to fetch history logs from MySQL:', err);
            }
        }

        function updateMetricsAndRender() {
            const tbody = document.getElementById('historyTableBody');

            // Update Top Metrics
            document.getElementById('totalScansCount').innerText = historyData.length;
            
            const safeCount = historyData.filter(h => h.status.toLowerCase() === 'low risk' || h.status.toLowerCase() === 'safe').length;
            const mediumCount = historyData.filter(h => h.status.toLowerCase() === 'medium risk').length;
            const highCount = historyData.filter(h => h.status.toLowerCase() === 'high risk' || h.status.toLowerCase() === 'threat' || h.status.toLowerCase() === 'malicious').length;

            document.getElementById('safeScansCount').innerText = safeCount;
            document.getElementById('mediumScansCount').innerText = mediumCount;
            document.getElementById('threatScansCount').innerText = highCount;

            const clearContainer = document.getElementById('clearHistoryContainer');
            if (clearContainer) {
                if (historyData.length > 0) {
                    clearContainer.innerHTML = `
                        <button onclick="clearAllHistory()" class="text-xs font-bold text-red-400 hover:text-white border border-red-500/30 hover:bg-red-500/20 px-4 py-2 rounded-xl transition-all">
                            CLEAR ALL LOGS
                        </button>
                    `;
                } else {
                    clearContainer.innerHTML = '';
                }
            }

            renderHistory(historyData);
        }

        function renderHistory(dataToRender) {
            const tbody = document.getElementById('historyTableBody');
            if (!tbody) return;

            if (dataToRender.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-20 text-center text-gray-500">
                            <div class="flex flex-col items-center justify-center space-y-3">
                                <div class="w-14 h-14 rounded-2xl bg-surfaceBorder/50 flex items-center justify-center text-gray-500">
                                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                </div>
                                <h4 class="text-white font-bold text-base">No Matching History Logs Found</h4>
                                <p class="text-xs">Try adjusting your search query.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = '';
            dataToRender.forEach((item) => {
                const originalIndex = historyData.indexOf(item);
                const tr = document.createElement('tr');
                tr.className = "hover:bg-surfaceBorder/30 transition-colors group";
                
                const displayName = item.appName || item.target;
                const packageIdSubtext = item.appName ? `<span class="text-[10px] font-mono text-gray-500 block truncate mt-0.5">${item.target}</span>` : '';

                tr.innerHTML = `
                    <td class="px-6 py-4 font-mono text-xs text-gray-400 whitespace-nowrap">${item.date}</td>
                    <td class="px-6 py-4 font-mono text-white font-medium max-w-[280px]">
                        <div class="truncate" title="${displayName}">${displayName}</div>
                        ${packageIdSubtext}
                    </td>
                    <td class="px-6 py-4 font-mono font-bold ${item.colorClass}">${item.riskScore} <span class="text-[10px] text-gray-600">/100</span></td>
                    <td class="px-6 py-4">
                        <span class="px-2.5 py-1 rounded-lg text-[10px] font-mono uppercase font-bold border ${item.colorClass.replace('text', 'border')}/40 ${item.colorClass} bg-background/50">${item.status}</span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="deleteLog(${originalIndex})" class="p-2 bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500 hover:text-white rounded-lg transition-all" title="Delete Log">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterHistory() {
            const query = document.getElementById('searchHistoryInput').value.toLowerCase().trim();
            const filtered = historyData.filter(item => 
                (item.appName && item.appName.toLowerCase().includes(query)) ||
                item.target.toLowerCase().includes(query) || 
                item.status.toLowerCase().includes(query) || 
                (item.threats && item.threats.some(t => t.toLowerCase().includes(query)))
            );
            renderHistory(filtered);
        }

        function deleteLog(index) {
            if(confirm("Are you sure you want to remove this log?")) {
                // If using database backend, you can hook a backend delete API endpoint here if required.
                historyData.splice(index, 1);
                updateMetricsAndRender();
            }
        }

        function clearAllHistory() {
            if(confirm("Are you sure you want to clear all app audit logs?")) {
                historyData = [];
                updateMetricsAndRender();
            }
        }

        // Initialize data load on page startup
        fetchHistoryLogs();
    </script>
</body>
