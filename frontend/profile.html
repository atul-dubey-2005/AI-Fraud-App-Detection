                                </button>

                            <!-- Step 2: Verify OTP (Hidden initially) -->

                <!-- Security & Password -->
                <div class="p-6 lg:p-8 bg-surface border border-surfaceBorder rounded-3xl shadow-xl flex flex-col justify-between">
                    <div>
                        <h3 class="text-white font-bold text-base lg:text-lg mb-6 flex items-center space-x-2">
                            <svg class="w-5 h-5 text-primary shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            <span>Security</span>
                        </h3>
                        <p class="text-sm text-gray-400 mb-6 leading-relaxed">Update your password to keep your FraudShield AI account secure.</p>
                        <form id="changePasswordForm" class="space-y-4">
                            <div>
                                <input type="email" id="confirmEmail" required placeholder="Confirm your Email" class="w-full bg-background border border-gray-800 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-primary/50 transition-colors">
                            </div>
                            <div class="relative">
                                <input type="password" id="currentPassword" required placeholder="Current Password" class="w-full bg-background border border-gray-800 rounded-xl py-3 pl-4 pr-10 text-white focus:outline-none focus:border-primary/50 transition-colors">
                                <button type="button" id="toggleCurrentPasswordBtn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-white transition-colors focus:outline-none">
                                    <svg id="currentEyeClosedIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                                    </svg>
                                    <svg id="currentEyeOpenIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                    </svg>
                                </button>
                            </div>
                            <div class="relative">
                                <input type="password" id="newPassword" required minlength="6" placeholder="New Password" class="w-full bg-background border border-gray-800 rounded-xl py-3 pl-4 pr-10 text-white focus:outline-none focus:border-primary/50 transition-colors">
                                <button type="button" id="toggleNewPasswordBtn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-white transition-colors focus:outline-none">
                                    <svg id="newEyeClosedIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                                    </svg>
                                    <svg id="newEyeOpenIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                    </svg>
                                </button>
                            </div>
                            <button type="submit" id="updatePassBtn" class="w-full bg-red-500/10 border border-red-500/50 text-red-400 hover:bg-red-500 hover:text-white font-bold py-3 rounded-xl transition-all duration-300">
                                UPDATE PASSWORD

    <script>
        // Logout Handler Logic
        function handleLogout() {
            localStorage.removeItem('userLoggedIn');
            localStorage.removeItem('userName');
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userRole');
            window.location.href = 'login.html';
        }

        const mobileLogoutBtn = document.getElementById('mobileLogoutBtn');
        const pcLogoutBtn = document.getElementById('pcLogoutBtn');

        if (mobileLogoutBtn) mobileLogoutBtn.addEventListener('click', handleLogout);
        if (pcLogoutBtn) pcLogoutBtn.addEventListener('click', handleLogout);

        // Toggle Password Visibility for Current Password
        const toggleCurrentPasswordBtn = document.getElementById('toggleCurrentPasswordBtn');
        const currentPasswordInput = document.getElementById('currentPassword');
        const currentEyeClosedIcon = document.getElementById('currentEyeClosedIcon');
        const currentEyeOpenIcon = document.getElementById('currentEyeOpenIcon');

        if (toggleCurrentPasswordBtn && currentPasswordInput) {
            toggleCurrentPasswordBtn.addEventListener('click', () => {
                const isPassword = currentPasswordInput.type === 'password';
                currentPasswordInput.type = isPassword ? 'text' : 'password';
                if (isPassword) {
                    currentEyeClosedIcon.classList.add('hidden');
                    currentEyeOpenIcon.classList.remove('hidden');
                } else {
                    currentEyeOpenIcon.classList.add('hidden');
                    currentEyeClosedIcon.classList.remove('hidden');
                }
            });
        }

        // Toggle Password Visibility for New Password
        const toggleNewPasswordBtn = document.getElementById('toggleNewPasswordBtn');
        const newPasswordInput = document.getElementById('newPassword');
        const newEyeClosedIcon = document.getElementById('newEyeClosedIcon');
        const newEyeOpenIcon = document.getElementById('newEyeOpenIcon');

        if (toggleNewPasswordBtn && newPasswordInput) {
            toggleNewPasswordBtn.addEventListener('click', () => {
                const isPassword = newPasswordInput.type === 'password';
                newPasswordInput.type = isPassword ? 'text' : 'password';
                if (isPassword) {
                    newEyeClosedIcon.classList.add('hidden');
                    newEyeOpenIcon.classList.remove('hidden');
                } else {
                    newEyeOpenIcon.classList.add('hidden');
                    newEyeClosedIcon.classList.remove('hidden');
                }
            });
        }

        // Mobile Sidebar Toggle Logic
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('menu-btn');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const sidebarLinks = document.querySelectorAll('#sidebar nav a');

            function toggleMenu() {
                sidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            }

            if (menuBtn) menuBtn.addEventListener('click', toggleMenu);
            if (overlay) overlay.addEventListener('click', toggleMenu);

            sidebarLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if (window.innerWidth < 1024) {
                        toggleMenu();
                    }
                });
            });
        });

        // Load User Details
        const userName = localStorage.getItem('userName') || 'FraudShield User';
        const userRole = localStorage.getItem('userRole') || 'user';

        document.getElementById('profile-name').innerText = userName;
        document.getElementById('update-name').value = userName;
        document.getElementById('profile-role').innerText = userRole;
        document.getElementById('profile-avatar').innerText = userName.charAt(0).toUpperCase();

        // Update Profile API with OTP Logic
        const profileStep1 = document.getElementById('profile-step-1');
        const profileStep2 = document.getElementById('profile-step-2');

        document.getElementById('updateProfileForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('update-email').value.trim();
            const btn = document.getElementById('sendUpdateOtpBtn');

            btn.disabled = true;
            btn.textContent = "SENDING OTP...";

            try {
                const response = await fetch('/api/send-update-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();
                if (response.ok) {
                    profileStep1.classList.add('hidden');
                    profileStep2.classList.remove('hidden');
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                alert('Server connection error.');
            } finally {
                btn.disabled = false;
                btn.textContent = "SEND OTP";
            }
        });

        document.getElementById('verifyUpdateBtn').addEventListener('click', async function() {
            const newName = document.getElementById('update-name').value.trim();
            const email = document.getElementById('update-email').value.trim();
            const otp = document.getElementById('update-otp').value.trim();
            const btn = document.getElementById('verifyUpdateBtn');

            if (!otp) return alert("Please enter the 6-digit OTP");

            btn.disabled = true;
            btn.textContent = "VERIFYING...";

            try {
                const response = await fetch('/api/verify-update-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp, newName })
                });

                const data = await response.json();
                if (response.ok) {
                    alert('Profile name updated successfully!');

                    localStorage.setItem('userName', newName);
                    document.getElementById('profile-name').innerText = newName;
                    document.getElementById('profile-avatar').innerText = newName.charAt(0).toUpperCase();

                    document.getElementById('update-otp').value = '';
                    document.getElementById('update-email').value = '';
                    profileStep2.classList.add('hidden');
                    profileStep1.classList.remove('hidden');
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                alert('Server connection error.');
            } finally {
                btn.disabled = false;
                btn.textContent = "VERIFY & SAVE";
            }
        });

        document.getElementById('cancelUpdateBtn').addEventListener('click', () => {
            profileStep2.classList.add('hidden');
            profileStep1.classList.remove('hidden');
            document.getElementById('update-otp').value = '';
        });

        // Change Password API Integration
        document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('confirmEmail').value.trim();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const btn = document.getElementById('updatePassBtn');

            btn.disabled = true;
            btn.textContent = "UPDATING...";

            try {
                const response = await fetch('/api/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, currentPassword, newPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Password updated successfully! Next time, login with your new password.');
                    document.getElementById('changePasswordForm').reset();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                alert('Server connection error.');
            } finally {
                btn.disabled = false;
                btn.textContent = "UPDATE PASSWORD";
            }
        });
    </script>
</body>
</html>
