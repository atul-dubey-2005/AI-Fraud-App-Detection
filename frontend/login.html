<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2309090b' stroke='%2300ff66' stroke-width='2'/><path d='M16 5 L24 9 V15 C24 20 20 24.5 16 26 C12 24.5 8 20 8 15 V9 Z' fill='rgba(0,255,102,0.15)' stroke='%2300ff66' stroke-width='1.5'/><text x='16' y='17.5' font-family='sans-serif' font-weight='900' font-size='11' fill='%23ffffff' text-anchor='middle'>FS</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FraudShield AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#09090b',
                        surface: '#121214',
                        primary: '#00ff66',
                        'primary-dark': '#00cc52',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');
    </style>
</head>
<body class="bg-background text-gray-300 h-screen flex items-center justify-center selection:bg-primary selection:text-black overflow-hidden relative">

    <!-- Background Decorative Elements -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
    </div>

    <!-- Login Container -->
    <div class="w-full max-w-md px-8 py-10 bg-surface border border-gray-800 rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.5)] relative z-10">
        
        <!-- Back to Home Link -->
        <a href="index.html" class="absolute top-6 left-6 text-gray-500 hover:text-white transition-colors flex items-center space-x-2 text-sm font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span>Back</span>
        </a>

        <!-- Logo & Header -->
        <div id="login-header-ui" class="flex flex-col items-center mb-8 mt-4">
            <div class="w-12 h-12 rounded-xl bg-primary/20 flex items-center justify-center border border-primary mb-4 shadow-[0_0_20px_rgba(0,255,102,0.2)]">
                <svg class="w-7 h-7 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            </div>
            <h1 class="text-white font-bold text-2xl tracking-wide">Welcome Back!</h1>
            <p class="text-gray-500 text-sm mt-1">Log in to your FraudShield account.</p>
        </div>

        <!-- FORM -->
        <form id="loginForm" class="space-y-5">
            
            <!-- Email Input -->
            <div>
                <label for="email" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>
                    <input type="email" id="email" required placeholder="you@example.com" class="w-full bg-background border border-gray-800 rounded-xl py-3 pl-10 pr-4 text-white placeholder-gray-600 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-colors">
                </div>
            </div>

            <!-- Password Input -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="password" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Password</label>
                    <a href="#" id="showForgotUiBtn" class="text-xs text-primary hover:text-white transition-colors">Forgot?</a>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full bg-background border border-gray-800 rounded-xl py-3 pl-10 pr-4 text-white placeholder-gray-600 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-colors">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full mt-6 bg-primary hover:bg-primary-dark text-black font-bold py-3.5 rounded-xl transition-all duration-300 flex justify-center items-center space-x-2">
                <span id="btnText">LOG IN TO ACCOUNT</span>
                <!-- Loading Spinner -->
                <svg id="loadingSpinner" class="hidden animate-spin h-5 w-5 text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

        <div id="extra-login-ui">
            <!-- Divider -->
            <div class="mt-8 mb-6 flex items-center">
                <div class="flex-grow border-t border-gray-800"></div>
                <span class="flex-shrink-0 px-4 text-gray-600 text-xs uppercase font-semibold">Or continue with</span>
                <div class="flex-grow border-t border-gray-800"></div>
            </div>

            <!-- Social Logins -->
            <div class="grid grid-cols-2 gap-4">
                <a href="http://localhost:3000/auth/github" class="flex justify-center items-center py-2.5 bg-[#121214] border border-gray-700 rounded-xl hover:bg-gray-800 hover:text-white transition-all duration-200 group cursor-pointer">
                    <svg class="w-5 h-5 mr-2 text-gray-400 group-hover:text-white transition-colors" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path></svg>
                    <span class="text-sm font-semibold text-gray-300 group-hover:text-white transition-colors">GitHub</span>
                </a>
                
                <a href="http://localhost:3000/auth/google" class="flex justify-center items-center py-2.5 bg-[#121214] border border-gray-700 rounded-xl hover:bg-gray-800 transition-all duration-200 cursor-pointer">
                    <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/><path fill="none" d="M1 1h22v22H1z"/></svg>
                    <span class="text-sm font-semibold text-gray-300">Google</span>
                </a>
            </div>

            <!-- Sign up Link -->
            <p class="mt-8 text-center text-sm text-gray-500">
                Don't have an account? <a href="register.html" class="text-primary hover:text-white font-semibold transition-colors">Sign up</a>
            </p>
        </div>
        
        <!-- VIEW 2: FORGOT PASSWORD OTP VERIFICATION (Hidden by Default) -->
        <div id="forgot-otp-view" class="hidden flex-col items-center justify-center py-4 mt-4">
            <div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center border border-primary/30 mb-4 shadow-[0_0_20px_rgba(0,255,102,0.1)]">
                <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
            </div>
            
            <h2 class="text-white font-bold text-2xl tracking-wide mb-2">Reset Password</h2>
            <p class="text-gray-400 text-sm text-center mb-8">
                Enter your email address and we'll send a 6-digit OTP to reset your password.
            </p>

            <form id="forgotEmailForm" class="w-full space-y-4">
                <div>
                    <input type="email" id="forgot-email" required placeholder="Enter your email" class="w-full bg-background border border-gray-800 rounded-xl py-3 px-4 text-white placeholder-gray-600 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-colors">
                </div>
                <button type="submit" id="forgotSubmitBtn" class="w-full bg-primary hover:bg-primary-dark text-black font-bold py-3.5 rounded-xl transition-all duration-300">
                    SEND OTP
                </button>
            </form>

            <button type="button" id="backToLoginBtn" class="mt-6 text-xs text-gray-500 hover:text-white transition-colors bg-transparent border-none cursor-pointer">
                &larr; Back to Login
            </button>
        </div>

    </div>

    <!-- SCRIPT -->
    <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('loadingSpinner');
        const submitBtn = document.getElementById('submitBtn');

        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
        btnText.textContent = 'AUTHENTICATING...';
        spinner.classList.remove('hidden');

        try {
            const response = await fetch('http://localhost:3000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Login failed');

            localStorage.setItem('userLoggedIn', 'true');
            localStorage.setItem('userName', data.userName || 'User');
            localStorage.setItem('userEmail', email);
            const userRole = (data.role || 'user').toLowerCase();
            localStorage.setItem('userRole', userRole);

            if (userRole === 'admin') {
                window.location.href = 'admin-dashboard.html';
            } else {
                window.location.href = 'dashboard.html';
            }

        } catch (error) {
            alert("Login Failed: " + error.message);
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
            btnText.textContent = 'LOG IN TO ACCOUNT';
            spinner.classList.add('hidden');
        }
    });

    // Toggle to Forgot Password View
    document.getElementById('showForgotUiBtn').addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById('login-header-ui').style.display = 'none';
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('extra-login-ui').style.display = 'none';
        const forgotView = document.getElementById('forgot-otp-view');
        forgotView.classList.remove('hidden');
        forgotView.classList.add('flex');
    });

    document.getElementById('backToLoginBtn').addEventListener('click', (e) => {
        e.preventDefault();
        window.location.reload();
    });

    // Forgot Password Email & Reset Flow
    let resetEmail = "";
    document.getElementById('forgotEmailForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        resetEmail = document.getElementById('forgot-email').value.trim();
        const submitBtn = document.getElementById('forgotSubmitBtn');

        submitBtn.disabled = true;
        submitBtn.textContent = "SENDING OTP...";

        try {
            const response = await fetch('http://localhost:3000/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: resetEmail })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Failed to send reset OTP');

            alert("Password reset OTP sent! Check your email.");

            // Change View to Enter OTP and New Password
            document.getElementById('forgot-otp-view').innerHTML = `
                <div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center border border-primary/30 mb-4 shadow-[0_0_20px_rgba(0,255,102,0.1)]">
                    <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h2 class="text-white font-bold text-2xl tracking-wide mb-2">Set New Password</h2>
                <p class="text-gray-400 text-sm text-center mb-6">Enter the 6-digit OTP sent to your email and your new password.</p>
                <form id="resetPasswordForm" class="w-full space-y-4">
                    <input type="text" id="reset-otp" required maxlength="6" placeholder="••••••" class="w-full text-center tracking-[1em] font-bold text-xl bg-background border border-gray-800 rounded-xl py-3 text-white placeholder-gray-700 focus:outline-none focus:border-primary/50 transition-colors">
                    <input type="password" id="new-password" required minlength="6" placeholder="Enter new password" class="w-full bg-background border border-gray-800 rounded-xl py-3 px-4 text-white placeholder-gray-600 focus:outline-none focus:border-primary/50 transition-colors">
                    <button type="submit" id="resetSubmitBtn" class="w-full bg-primary hover:bg-primary-dark text-black font-bold py-3.5 rounded-xl transition-all duration-300">
                        RESET PASSWORD
                    </button>
                </form>
                <button type="button" onclick="window.location.reload()" class="mt-6 text-xs text-gray-500 hover:text-white transition-colors bg-transparent border-none cursor-pointer">
                    &larr; Back to Login
                </button>
            `;

            // Handle Reset Password Submit
            document.getElementById('resetPasswordForm').addEventListener('submit', async function(resEvent) {
                resEvent.preventDefault();
                const otp = document.getElementById('reset-otp').value.trim();
                const newPassword = document.getElementById('new-password').value;
                const resetBtn = document.getElementById('resetSubmitBtn');

                resetBtn.disabled = true;
                resetBtn.textContent = "UPDATING...";

                try {
                    const resetRes = await fetch('http://localhost:3000/api/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: resetEmail, otp, newPassword })
                    });

                    const resetData = await resetRes.json();
                    if (!resetRes.ok) throw new Error(resetData.message || 'Password reset failed');

                    alert('Password updated successfully! Please log in.');
                    window.location.reload();
                } catch (err) {
                    alert("Error: " + err.message);
                    resetBtn.disabled = false;
                    resetBtn.textContent = "RESET PASSWORD";
                }
            });

        } catch (error) {
            alert("Error: " + error.message);
            submitBtn.disabled = false;
            submitBtn.textContent = "SEND OTP";
        }
    });
</script>
</body>
</html>
