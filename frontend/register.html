<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2309090b' stroke='%2300ff66' stroke-width='2'/><path d='M16 5 L24 9 V15 C24 20 20 24.5 16 26 C12 24.5 8 20 8 15 V9 Z' fill='rgba(0,255,102,0.15)' stroke='%2300ff66' stroke-width='1.5'/><text x='16' y='17.5' font-family='sans-serif' font-weight='900' font-size='11' fill='%23ffffff' text-anchor='middle'>FS</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FraudShield AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SUPABASE CDN ADD KIYA GAYA HAI -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#09090b',
                        surface: '#121214',
                        primary: '#00ff66',
                        'primary-dark': '#00cc52',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');
    </style>
</head>
<body class="bg-background text-gray-300 h-screen flex items-center justify-center selection:bg-primary selection:text-black overflow-hidden relative">

    <!-- Background Decorative Elements -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
    </div>

    <!-- Registration Container -->
    <div class="w-full max-w-md px-8 py-8 bg-surface border border-gray-800 rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.5)] relative z-10 overflow-hidden">

        <!-- Back to Home Link -->
        <a href="index.html" class="absolute top-6 left-6 text-gray-500 hover:text-white transition-colors flex items-center space-x-2 text-sm font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span>Back</span>
        </a>

        <!-- ============================================== -->
        <!-- STEP 1: REGISTRATION FORM -->
        <!-- ============================================== -->
        <div id="step-1" class="transition-all duration-300 block">
            <!-- Logo & Header -->
            <div class="flex flex-col items-center mb-6 mt-4">
                <h1 class="text-white font-bold text-2xl tracking-wide">Create an Account</h1>
                <p class="text-gray-500 text-sm mt-1">Join FraudShield AI today.</p>
            </div>

            <!-- Form -->
            <form id="registerForm" class="space-y-4">

                <!-- Full Name Input -->
                <div>
                    <label for="name" class="block text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-2">Full Name</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </div>
                        <input type="text" id="name" required pattern="[A-Za-z\s]+" title="Only alphabets and spaces are allowed" placeholder="John Doe" class="w-full bg-background border border-gray-800 rounded-xl py-2.5 pl-10 pr-4 text-white placeholder-gray-600 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-colors">
                    </div>
                </div>

                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        </div>
                        <input type="email" id="email" required placeholder="you@example.com" class="w-full bg-background border border-gray-800 rounded-xl py-2.5 pl-10 pr-4 text-white placeholder-gray-600 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-colors">
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </div>
                        <input type="password" id="password" required minlength="6" placeholder="Create a strong password" class="w-full bg-background border border-gray-800 rounded-xl py-2.5 pl-10 pr-10 text-white placeholder-gray-600 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-colors">
                        
                        <!-- Toggle Password Eye Button -->
                        <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-white transition-colors focus:outline-none">
                            <!-- Closed Eye Icon (Default) -->
                            <svg id="eyeClosedIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                            </svg>
                            <!-- Opened Eye Icon (Hidden by default) -->
                            <svg id="eyeOpenIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password Input -->
                <div>
                    <label for="confirm_password" class="block text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-2">Confirm Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </div>
                        <input type="password" id="confirm_password" required minlength="6" placeholder="Confirm your password" class="w-full bg-background border border-gray-800 rounded-xl py-2.5 pl-10 pr-10 text-white placeholder-gray-600 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-colors">
                        
                        <!-- Toggle Confirm Password Eye Button -->
                        <button type="button" id="toggleConfirmPasswordBtn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-white transition-colors focus:outline-none">
                            <!-- Closed Eye Icon (Default) -->
                            <svg id="confirmEyeClosedIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                            </svg>
                            <!-- Opened Eye Icon (Hidden by default) -->
                            <svg id="confirmEyeOpenIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>
                    <!-- Error Message Div -->
                    <p id="password-error" class="hidden text-red-500 text-[11px] font-semibold mt-1.5 ml-1">Passwords do not match!</p>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="registerBtn" class="w-full mt-4 bg-primary hover:bg-primary-dark text-black font-bold py-3 rounded-xl transition-all duration-300 flex justify-center items-center space-x-2">
                    <span id="registerBtnText">CREATE ACCOUNT</span>
                </button>
            </form>

            <div class="mt-6 mb-6 flex items-center">
                <div class="flex-grow border-t border-gray-800"></div>
                <span class="flex-shrink-0 px-4 text-gray-600 text-xs uppercase font-semibold">Or sign up with</span>
                <div class="flex-grow border-t border-gray-800"></div>
            </div>

            <!-- Social Logins -->
            <div class="grid grid-cols-2 gap-4">
                <a href="/auth/github" class="flex justify-center items-center py-2 bg-[#121214] border border-gray-700 rounded-xl hover:bg-gray-800 hover:text-white transition-all duration-200 group">
                    <svg class="w-4 h-4 mr-2 text-gray-400 group-hover:text-white transition-colors" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path></svg>
                    <span class="text-sm font-semibold text-gray-300 group-hover:text-white transition-colors">GitHub</span>
                </a>

                <a href="/auth/google" class="flex justify-center items-center py-2 bg-[#121214] border border-gray-700 rounded-xl hover:bg-gray-800 transition-all duration-200">
                    <svg class="w-4 h-4 mr-2" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/><path fill="none" d="M1 1h22v22H1z"/></svg>
                    <span class="text-sm font-semibold text-gray-300">Google</span>
                </a>
            </div>

            <p class="mt-8 text-center text-sm text-gray-500">
                Already have an account? <a href="login.html" class="text-primary hover:text-white font-semibold transition-colors">Log in</a>
            </p>
        </div>

        <!-- ============================================== -->
        <!-- STEP 2: OTP VERIFICATION (Hidden By Default) -->
        <!-- ============================================== -->
        <div id="step-2" class="hidden flex-col items-center justify-center py-6 mt-4">
            <div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center border border-primary/30 mb-4 shadow-[0_0_20px_rgba(0,255,102,0.1)]">
                <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>

            <h2 class="text-white font-bold text-2xl tracking-wide mb-2">Verify Your Email</h2>
            <p class="text-gray-400 text-sm text-center mb-8">
                We've sent a 6-digit verification code to<br>
                <span id="display-user-email" class="text-primary font-medium"></span>
            </p>

            <form id="otpForm" class="w-full space-y-6">
                <div>
                    <input type="text" id="otp_input" maxlength="6" placeholder="••••••" required class="w-full text-center tracking-[1em] font-bold text-2xl bg-background border border-gray-800 rounded-xl py-3 text-white placeholder-gray-700 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-colors">
                </div>

                <button type="submit" id="otpSubmitBtn" class="w-full bg-primary hover:bg-primary-dark text-black font-bold py-3 rounded-xl transition-all duration-300">
                    VERIFY & PROCEED
                </button>
            </form>
        </div>

    </div>

    <!-- NODE.JS + MYSQL BACKEND REGISTRATION SCRIPT -->
    <script>
        // Toggle Password Visibility Logic for Password Field
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        const eyeClosedIcon = document.getElementById('eyeClosedIcon');
        const eyeOpenIcon = document.getElementById('eyeOpenIcon');

        if (togglePasswordBtn && passwordInput) {
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                
                if (isPassword) {
                    eyeClosedIcon.classList.add('hidden');
                    eyeOpenIcon.classList.remove('hidden');
                } else {
                    eyeOpenIcon.classList.add('hidden');
                    eyeClosedIcon.classList.remove('hidden');
                }
            });
        }

        // Toggle Password Visibility Logic for Confirm Password Field
        const toggleConfirmPasswordBtn = document.getElementById('toggleConfirmPasswordBtn');
        const confirmPasswordInput = document.getElementById('confirm_password');
        const confirmEyeClosedIcon = document.getElementById('confirmEyeClosedIcon');
        const confirmEyeOpenIcon = document.getElementById('confirmEyeOpenIcon');

        if (toggleConfirmPasswordBtn && confirmPasswordInput) {
            toggleConfirmPasswordBtn.addEventListener('click', () => {
                const isPassword = confirmPasswordInput.type === 'password';
                confirmPasswordInput.type = isPassword ? 'text' : 'password';
                
                if (isPassword) {
                    confirmEyeClosedIcon.classList.add('hidden');
                    confirmEyeOpenIcon.classList.remove('hidden');
                } else {
                    confirmEyeOpenIcon.classList.add('hidden');
                    confirmEyeClosedIcon.classList.remove('hidden');
                }
            });
        }

        let registeredEmail = ""; 

        // 1. Handle Step 1 (Registration Form Submit)
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 

            const fullName = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const errorMsg = document.getElementById('password-error');
            const btnText = document.getElementById('registerBtnText');
            const submitBtn = document.getElementById('registerBtn');

            // Password Match Validation
            if (password !== confirmPassword) {
                errorMsg.classList.remove('hidden');
                document.getElementById('confirm_password').classList.replace('border-gray-800', 'border-red-500');
                return;
            } else {
                errorMsg.classList.add('hidden');
                document.getElementById('confirm_password').classList.replace('border-red-500', 'border-gray-800');
            }

            // Start Loading State
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
            btnText.textContent = 'CREATING ACCOUNT...';

            try {
                // Node.js Backend API Call for Sign Up
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name: fullName, email, password })
                });

                const data = await response.json();

                // 🛑 Yahan par response check aur popup integration kiya gaya hai:
                if (!response.ok) {
                    alert(data.message); // Agar email already exist karegi toh popup aa jayega
                    return; // Aage OTP page par jaane se rok dega
                }

                // Agar OTP successfully bhej diya gaya, toh Step 2 (OTP Screen) dikhayein
                registeredEmail = email;
                document.getElementById('display-user-email').innerText = email;
                document.getElementById('step-1').classList.add('hidden');
                document.getElementById('step-2').classList.remove('hidden');
                document.getElementById('step-2').classList.add('flex');

            } catch (error) {
                alert("Sign Up Failed: " + error.message);
            } finally {
                // Reset Button State
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                btnText.textContent = 'CREATE ACCOUNT';
            }
        });

        // 2. Handle Step 2 (OTP Verification Form Submit)
        document.getElementById('otpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const otpToken = document.getElementById('otp_input').value;
            const submitBtn = document.getElementById('otpSubmitBtn');

            submitBtn.disabled = true;
            submitBtn.innerText = "VERIFYING...";

            try {
                // Node.js Backend API Call for OTP Verification
                const response = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: registeredEmail, otp: otpToken })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Invalid OTP');
                }

                // Verification successful
                alert("Email Verified Successfully! Please log in.");
                window.location.href = 'login.html'; // Login page par bhej dein

            } catch (error) {
                alert("Verification Failed: " + error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "VERIFY & PROCEED";
            }
        });
    </script>
</body>
</html>
